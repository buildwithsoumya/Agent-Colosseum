name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Install, lint, typecheck, unit-test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colosseum
          POSTGRES_PASSWORD: colosseum_dev_pw
          POSTGRES_DB: agent_colosseum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colosseum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://colosseum:colosseum_dev_pw@localhost:5432/agent_colosseum_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-not-real-credentials-000000000000
      SEED_ADMIN_EMAIL: admin@colosseum.dev
      SEED_ADMIN_PASSWORD: admin123

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma migrate (verify migrations apply cleanly)
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
