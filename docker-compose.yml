name: agent-colosseum

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colosseum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colosseum_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-agent_colosseum}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colosseum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-colosseum}:${POSTGRES_PASSWORD:-colosseum_dev_pw}@postgres:5432/${POSTGRES_DB:-agent_colosseum}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-change-me-generate-a-long-random-hex-string}
      STORAGE_DRIVER: local
    ports:
      - "4000:4000"

  evaluator:
    build:
      context: .
      dockerfile: evaluator/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-colosseum}:${POSTGRES_PASSWORD:-colosseum_dev_pw}@postgres:5432/${POSTGRES_DB:-agent_colosseum}?schema=public
      REDIS_URL: redis://redis:6379
      EVALUATOR_MODE: simulated
      EVALUATOR_CONCURRENCY: "2"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
